# Локальний запуск бекенду разом із PostgreSQL:  docker compose up --build
# API: http://localhost:8000  ·  Swagger: http://localhost:8000/docs  (тестові облікові дані – лише для розробки)
name: edureg-backend
services:
  db:
    image: postgres:16-alpine
    container_name: edureg_db_lab8
    environment:
      POSTGRES_USER: edureg
      POSTGRES_PASSWORD: edureg_dev
      POSTGRES_DB: edureg
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edureg -d edureg"]
      interval: 3s
      retries: 20
  api:
    build: .
    container_name: edureg_api_lab8
    environment:
      DATABASE_URL: postgresql://edureg:edureg_dev@db:5432/edureg
      SECRET_KEY: local-dev-secret-change-me
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173,https://ivankrutyi23.github.io
      SEED_DEMO: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
